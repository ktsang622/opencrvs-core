# Docker Compose for Cloud Deployment with Traefik
# Uses AWS ECR images and Traefik for SSL termination
#
# Usage:
#   # Start Traefik first (in traefik folder)
#   # Then:
#   docker compose --env-file .env.demo -f docker-compose.infra.yml -f docker-compose.cloud.yml up -d

x-common-labels: &common-labels
  traefik.enable: "true"
  traefik.docker.network: "opencrvs-network"

services:
  # ============================================
  # Tier 1 - Core Infrastructure Services
  # ============================================

  config:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/config:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGO_URL=${MONGO_URL:-mongodb://mongo1/application-config}
      - AUTH_URL=${AUTH_URL_INTERNAL:-http://auth:4040}
      - CERT_PRIVATE_KEY_PATH=${CERT_PRIVATE_KEY_PATH:-/secrets/private-key.pem}
      - CERT_PUBLIC_KEY_PATH=${CERT_PUBLIC_KEY_PATH:-/secrets/public-key.pem}
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      - auth
    networks:
      - opencrvs-network
    labels:
      <<: *common-labels
      traefik.http.routers.config.rule: "Host(`config.${DOMAIN:-opencrvs.ktsang.com}`)"
      traefik.http.routers.config.entrypoints: "websecure"
      traefik.http.routers.config.tls: "true"
      traefik.http.routers.config.tls.certresolver: "httpchallenge"
      traefik.http.services.config.loadbalancer.server.port: "2021"

  auth:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/auth:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGO_URL=${MONGO_URL:-mongodb://mongo1/user-mgnt}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - CERT_PRIVATE_KEY_PATH=${CERT_PRIVATE_KEY_PATH:-/secrets/private-key.pem}
      - CERT_PUBLIC_KEY_PATH=${CERT_PUBLIC_KEY_PATH:-/secrets/public-key.pem}
    volumes:
      - ./secrets:/secrets:ro
    networks:
      - opencrvs-network
    labels:
      <<: *common-labels
      traefik.http.routers.auth.rule: "Host(`auth.${DOMAIN:-opencrvs.ktsang.com}`)"
      traefik.http.routers.auth.entrypoints: "websecure"
      traefik.http.routers.auth.tls: "true"
      traefik.http.routers.auth.tls.certresolver: "httpchallenge"
      traefik.http.services.auth.loadbalancer.server.port: "4040"

  notification:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/notification:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - AUTH_URL=${AUTH_URL_INTERNAL:-http://auth:4040}
      - COUNTRY_CONFIG_URL=${COUNTRY_CONFIG_URL_INTERNAL:-http://countryconfig:3040}
    depends_on:
      - auth
    networks:
      - opencrvs-network

  # ============================================
  # Tier 2 - User & Documents Services
  # ============================================

  user-mgnt:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/user-mgnt:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGO_URL=${MONGO_URL:-mongodb://mongo1/user-mgnt}
      - AUTH_URL=${AUTH_URL_INTERNAL:-http://auth:4040}
    depends_on:
      - auth
    networks:
      - opencrvs-network

  documents:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/documents:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MINIO_HOST=${MINIO_HOST:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - AUTH_URL=${AUTH_URL_INTERNAL:-http://auth:4040}
    depends_on:
      - auth
    networks:
      - opencrvs-network

  webhooks:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/webhooks:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGO_URL=${MONGO_URL:-mongodb://mongo1/webhooks}
      - AUTH_URL=${AUTH_URL_INTERNAL:-http://auth:4040}
    depends_on:
      - auth
    networks:
      - opencrvs-network

  # ============================================
  # Tier 3 - Data Services
  # ============================================

  search:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/search:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - ES_HOST=${ES_HOST:-opensearch:9200}
      - AUTH_URL=${AUTH_URL_INTERNAL:-http://auth:4040}
    depends_on:
      - auth
    networks:
      - opencrvs-network

  metrics:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/metrics:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - INFLUX_HOST=${INFLUX_HOST:-influxdb}
      - INFLUX_PORT=${INFLUX_PORT:-8086}
      - AUTH_URL=${AUTH_URL_INTERNAL:-http://auth:4040}
    depends_on:
      - auth
    networks:
      - opencrvs-network

  workflow:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/workflow:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGO_URL=${MONGO_URL:-mongodb://mongo1/hearth-dev}
      - AUTH_URL=${AUTH_URL_INTERNAL:-http://auth:4040}
      - COUNTRY_CONFIG_URL=${COUNTRY_CONFIG_URL_INTERNAL:-http://countryconfig:3040}
    depends_on:
      - auth
      - hearth
    networks:
      - opencrvs-network

  # ============================================
  # Tier 4 - Gateway & Events
  # ============================================

  gateway:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/gateway:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - AUTH_URL=${AUTH_URL_INTERNAL:-http://auth:4040}
      - USER_MANAGEMENT_URL=http://user-mgnt:3030
      - WORKFLOW_URL=http://workflow:5050
      - SEARCH_URL=http://search:9090
      - METRICS_URL=http://metrics:1050
      - COUNTRY_CONFIG_URL=${COUNTRY_CONFIG_URL_INTERNAL:-http://countryconfig:3040}
      - WEBHOOKS_URL=http://webhooks:2525
      - DOCUMENTS_URL=http://documents:9050
      - NOTIFICATION_URL=http://notification:2020
      - CONFIG_URL=http://config:2021
      - CLIENT_APP_URL=${CLIENT_APP_URL:-https://register.opencrvs.ktsang.com}
      - LOGIN_URL=${LOGIN_URL:-https://login.opencrvs.ktsang.com}
    depends_on:
      - auth
      - user-mgnt
      - workflow
      - search
    networks:
      - opencrvs-network
    labels:
      <<: *common-labels
      traefik.http.routers.gateway.rule: "Host(`gateway.${DOMAIN:-opencrvs.ktsang.com}`)"
      traefik.http.routers.gateway.entrypoints: "websecure"
      traefik.http.routers.gateway.tls: "true"
      traefik.http.routers.gateway.tls.certresolver: "httpchallenge"
      traefik.http.services.gateway.loadbalancer.server.port: "7070"

  events:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/events:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_HOST=${REDIS_HOST:-redis}
      - AUTH_URL=${AUTH_URL_INTERNAL:-http://auth:4040}
    depends_on:
      - auth
    networks:
      - opencrvs-network

  # ============================================
  # Tier 5 - Support Services
  # ============================================

  migration:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/migration:${VERSION:-demo-1.8.0}
    restart: "no"
    environment:
      - NODE_ENV=production
      - MONGO_URL=${MONGO_URL:-mongodb://mongo1/hearth-dev}
      - ES_HOST=${ES_HOST:-opensearch:9200}
    depends_on:
      - hearth
    networks:
      - opencrvs-network

  data-seeder:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/data-seeder:${VERSION:-demo-1.8.0}
    restart: "no"
    environment:
      - NODE_ENV=production
      - MONGO_URL=${MONGO_URL:-mongodb://mongo1/hearth-dev}
      - AUTH_URL=${AUTH_URL_INTERNAL:-http://auth:4040}
    depends_on:
      - auth
      - hearth
    networks:
      - opencrvs-network

  scheduler:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/scheduler:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGO_URL=${MONGO_URL:-mongodb://mongo1/hearth-dev}
      - AUTH_URL=${AUTH_URL_INTERNAL:-http://auth:4040}
    depends_on:
      - auth
    networks:
      - opencrvs-network

  dashboards:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/dashboards:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - INFLUX_HOST=${INFLUX_HOST:-influxdb}
      - INFLUX_PORT=${INFLUX_PORT:-8086}
      - AUTH_URL=${AUTH_URL_INTERNAL:-http://auth:4040}
    depends_on:
      - auth
      - metrics
    networks:
      - opencrvs-network

  # ============================================
  # Tier 6 - Frontend Services
  # ============================================

  client:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/client:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - GATEWAY_URL=${GATEWAY_URL:-https://gateway.opencrvs.ktsang.com}
      - LOGIN_URL=${LOGIN_URL:-https://login.opencrvs.ktsang.com}
      - COUNTRY_CONFIG_URL=${COUNTRY_CONFIG_URL:-https://countryconfig.opencrvs.ktsang.com}
    depends_on:
      - gateway
    networks:
      - opencrvs-network
    labels:
      <<: *common-labels
      traefik.http.routers.client.rule: "Host(`register.${DOMAIN:-opencrvs.ktsang.com}`)"
      traefik.http.routers.client.entrypoints: "websecure"
      traefik.http.routers.client.tls: "true"
      traefik.http.routers.client.tls.certresolver: "httpchallenge"
      traefik.http.services.client.loadbalancer.server.port: "3000"

  login:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/login:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - GATEWAY_URL=${GATEWAY_URL:-https://gateway.opencrvs.ktsang.com}
      - CLIENT_APP_URL=${CLIENT_APP_URL:-https://register.opencrvs.ktsang.com}
    depends_on:
      - gateway
    networks:
      - opencrvs-network
    labels:
      <<: *common-labels
      traefik.http.routers.login.rule: "Host(`login.${DOMAIN:-opencrvs.ktsang.com}`)"
      traefik.http.routers.login.entrypoints: "websecure"
      traefik.http.routers.login.tls: "true"
      traefik.http.routers.login.tls.certresolver: "httpchallenge"
      traefik.http.services.login.loadbalancer.server.port: "3020"

  # ============================================
  # Tier 7 - Toppan Services
  # ============================================

  toppan-service:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/toppan-service:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${TOPPAN_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/toppan}
    depends_on:
      - postgres
    networks:
      - opencrvs-network

  toppan:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/toppan:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${TOPPAN_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/toppan}
    depends_on:
      - postgres
    networks:
      - opencrvs-network

  toppan-ui:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/toppan-ui:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TOPPAN_SERVICE_URL=http://toppan-service:3888
    depends_on:
      - toppan-service
    networks:
      - opencrvs-network
    labels:
      <<: *common-labels
      traefik.http.routers.toppan-ui.rule: "Host(`toppan.${DOMAIN:-opencrvs.ktsang.com}`)"
      traefik.http.routers.toppan-ui.entrypoints: "websecure"
      traefik.http.routers.toppan-ui.tls: "true"
      traefik.http.routers.toppan-ui.tls.certresolver: "httpchallenge"
      traefik.http.services.toppan-ui.loadbalancer.server.port: "3889"

  toppan-certificate:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/toppan-certificate:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:3890
    networks:
      - opencrvs-network
    labels:
      <<: *common-labels
      traefik.http.routers.toppan-cert.rule: "Host(`certificate.${DOMAIN:-opencrvs.ktsang.com}`)"
      traefik.http.routers.toppan-cert.entrypoints: "websecure"
      traefik.http.routers.toppan-cert.tls: "true"
      traefik.http.routers.toppan-cert.tls.certresolver: "httpchallenge"
      traefik.http.services.toppan-cert.loadbalancer.server.port: "3890"

  # ============================================
  # Country Configuration
  # ============================================

  countryconfig:
    image: ${ECR_REGISTRY:-695491315778.dkr.ecr.ap-east-1.amazonaws.com/toppancrvs}/countryconfig:${VERSION:-demo-1.8.0}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - AUTH_URL=${AUTH_URL_INTERNAL:-http://auth:4040}
      - GATEWAY_URL=http://gateway:7070
      - CERTIFICATE_SERVICE_URL=http://toppan-certificate:3890
      - CLIENT_APP_URL=${CLIENT_APP_URL:-https://register.opencrvs.ktsang.com}
      - LOGIN_URL=${LOGIN_URL:-https://login.opencrvs.ktsang.com}
    depends_on:
      - auth
    networks:
      - opencrvs-network
    labels:
      <<: *common-labels
      traefik.http.routers.countryconfig.rule: "Host(`countryconfig.${DOMAIN:-opencrvs.ktsang.com}`)"
      traefik.http.routers.countryconfig.entrypoints: "websecure"
      traefik.http.routers.countryconfig.tls: "true"
      traefik.http.routers.countryconfig.tls.certresolver: "httpchallenge"
      traefik.http.services.countryconfig.loadbalancer.server.port: "3040"

networks:
  opencrvs-network:
    external: true
