# ATG-specific overrides for local dependency stack. Uses dedicated host volumes
# so Mongo, Elasticsearch, Minio, etc. data does not clash with the default dev
# environment.
services:
  mongo1:
    ports:
      - '27017:27017'
    volumes:
      - './data-atg/mongo:/data/db'

  redis:
    ports:
      - '6379:6379'

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.4
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - './data-atg/elasticsearch:/usr/share/elasticsearch/data'
      - './data-atg/backups/elasticsearch:/data/backups/elasticsearch'
    environment:
      - 'discovery.type=single-node'
      - 'cluster.routing.allocation.disk.watermark.enable_for_single_data_node=true'
      - 'cluster.routing.allocation.disk.threshold_enabled=false'
      - path.repo=/data/backups/elasticsearch
      - 'ES_JAVA_OPTS=-Xms1024m -Xmx1024m'
      - xpack.security.enabled=false

  minio:
    ports:
      - '3535:3535'
      - '3536:3536'
    volumes:
      - './data-atg/minio:/data'
    command: server --address ":3535" --console-address ":3536" /data

  influxdb:
    ports:
      - '8086:8086'
    volumes:
      - './data-atg/influxdb:/var/lib/influxdb'
      - './data-atg/backups/influxdb:/data/backups/influxdb'
      - './infrastructure/influxdb.conf:/etc/influxdb/influxdb.conf'

  hearth:
    environment:
      - logger__level=warn
    volumes:
      - '.secrets/public-key.pem:/secrets/public-key.pem'
      - './infrastructure/hearth-plugins/checkDuplicateTask.js:/src/hearth/lib/plugins/checkDuplicateTask.js'
      - './infrastructure/hearth-queryparam-extensions.json:/src/hearth/config/queryparam-extensions.json'
    ports:
      - '3447:3447'

  postgres:
    image: postgres:15
    container_name: person_registry_pg_atg
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: person_registry
      POSTGRES_USER: registry_user
      POSTGRES_PASSWORD: registry_pass
    volumes:
      - family_tree_pgdata_atg:/var/lib/postgresql/data
      - './init/database.sql:/docker-entrypoint-initdb.d/01-database.sql'
      - './init/repair.sql:/docker-entrypoint-initdb.d/02-repair.sql'
      - './init/seed-data.sql:/docker-entrypoint-initdb.d/03-seed-data.sql'

  opensearch:
    build:
      context: ../opensearch
      dockerfile: Dockerfile.opensearch
    container_name: opensearch_atg
    restart: always
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=WelcomeDemo1.23@
    volumes:
      - opensearch_data_atg:/usr/share/opensearch/data
      - '../opensearch/init:/init'
    ports:
      - '19200:9200'
      - '19600:9600'

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.0.0
    container_name: opensearch-dashboards_atg
    environment:
      OPENSEARCH_HOSTS: 'http://opensearch:9200'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
    depends_on:
      - opensearch
    ports:
      - '5601:5601'

volumes:
  family_tree_pgdata_atg:
  family_tree_node_modules_atg:
  family_tree_nextjs_cache_atg:
  opensearch_data_atg:
