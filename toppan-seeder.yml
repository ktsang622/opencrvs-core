# Dedicated data seeder configuration for OpenCRVS

services:
  data-seeder:
    build:
      context: .
      dockerfile: packages/data-seeder/Dockerfile
    image: ${DOCKER_REGISTRY}/data-seeder:${VERSION:-latest}
    pull_policy: never
    container_name: opencrvs-data-seeder
    network_mode: "container:opencrvs-auth"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - AUTH_HOST=http://auth:4040
      - COUNTRY_CONFIG_HOST=http://countryconfig:3040
      - GATEWAY_HOST=http://gateway:7070
      - FHIR_URL=http://hearth:3447/fhir
      - MONGO_URL=mongodb://mongo1/application-config
      - USER_MGNT_MONGO_URL=mongodb://mongo1/user-mgnt
      - HEARTH_MONGO_URL=mongodb://mongo1/hearth-dev
      - DASHBOARD_MONGO_URL=mongodb://mongo1/performance
      - OPENHIM_MONGO_URL=mongodb://mongo1/openhim-dev
      - EVENTS_MONGO_URL=mongodb://mongo1/events
      - ES_HOST=elasticsearch:9200
      - INFLUX_HOST=influxdb
      - INFLUX_PORT=8086
      - INFLUX_DB=ocrvs
      - MINIO_BUCKET=ocrvs
      - COUNTRY_CONFIG_URL=http://countryconfig:3040
      - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD:-password}
      - ACTIVATE_USERS=true
    restart: "no"
    profiles:
      - seeder

